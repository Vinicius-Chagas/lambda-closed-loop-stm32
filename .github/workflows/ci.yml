name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

env:
  # bibliotecas do raylib (painel) + Xvfb para a captura de tela
  PAINEL_DEPS: >-
    libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
    libwayland-dev libxkbcommon-dev xvfb
  RENODE_IMAGE: antmicro/renode@sha256:b30df3a8ec4eb6c793cca6ed62733c3619363de52ffd9f52de98a11f3500471b

jobs:
  unit:
    name: Testes unitários
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unity (controle em C)
        run: make test-unit-c
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Bibliotecas do painel (raylib)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $PAINEL_DEPS
      - name: Go (planta, SIL, CAN, painel)
        run: make test-unit-go
      - name: Painel em modo demo (captura de tela)
        run: |
          cd go && go build -o ../build/painel ./cmd/painel
          cd .. && xvfb-run -a -s "-screen 0 1280x720x24" ./build/painel -demo -captura "$PWD/build/painel-demo.png" -apos 9
      - uses: actions/upload-artifact@v4
        with:
          name: painel-demo
          path: build/painel-demo.png

  firmware:
    name: Firmware (build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain ARM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi cmake
      - name: Compilar
        run: make firmware
      - uses: actions/upload-artifact@v4
        with:
          name: ecu-elf
          path: firmware/build/ecu.elf

  renode:
    name: Integração (Renode + Robot)
    needs: firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ecu-elf
          path: firmware/build
      - name: Baixar imagem do Renode
        run: |
          for i in 1 2 3 4; do docker pull "$RENODE_IMAGE" && break; sleep $((i * 10)); done
      - name: Testes Robot
        run: make test-renode
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Cliente Go contra o Renode
        run: make test-renode-go
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-results
          path: build/robot

  e2e:
    name: Ponta a ponta (vcan0)
    needs: firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ecu-elf
          path: firmware/build
      - name: vcan0 + can-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends can-utils $PAINEL_DEPS
          sudo modprobe vcan || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe vcan; }
          ./scripts/setup-vcan.sh vcan0
      - name: Baixar imagem do Renode
        run: |
          for i in 1 2 3 4; do docker pull "$RENODE_IMAGE" && break; sleep $((i * 10)); done
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Ponte SocketCAN (ECU → vcan0)
        run: ./scripts/check-vcan-bridge.sh vcan0
      - name: ECU + planta + painel pelo CAN
        run: ./scripts/e2e.sh
      - name: Painel na bancada real (captura de tela)
        run: |
          (cd go && go build -o ../build/painel ./cmd/painel)
          BANCADA_NOME=lambda-painel BANCADA_LOG=build/e2e/renode-painel.log \
            scripts/bancada.sh -can vcan0 > build/e2e/planta-painel.log 2>&1 &
          # o painel espera os frames; aplica o bico −20 % aos 15 s e captura aos 30 s
          xvfb-run -a -s "-screen 0 1280x720x24" ./build/painel -can vcan0 -captura "$PWD/build/e2e/painel-vcan.png" -apos 30
          kill %1 || true; wait || true
      - name: Gráfico da corrida
        if: always()
        run: test -f build/e2e/corrida.csv && make grafico CSV=build/e2e/corrida.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: |
            build/e2e
            build/vcan-*.log
