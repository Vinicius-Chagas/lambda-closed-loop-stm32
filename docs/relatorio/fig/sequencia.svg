n Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="middle">tensões (lockstep, 5 ms)</text><rect x="240" y="108" width="122" height="36" rx="2" fill="#fffbe6" stroke="#222" stroke-width="1.4"/><text x="301.0" y="119.4" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="middle">1 conversão de 3</text><text x="301.0" y="132.6" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="middle">canais/ms (≈ 21 µs)</text><line x1="230" y1="170" x2="370" y2="170" stroke="#222" stroke-width="1.4" marker-end="url(#fim)"/><text x="300.0" y="160.0" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="middle">fim do bloco (t = 0)</text><rect x="364" y="170" width="12" height="35" fill="#cfcfcf" stroke="#222" stroke-width="1"/><line x1="370" y1="205" x2="510" y2="205" stroke="#222" stroke-width="1.4" marker-end="url(#fim)"/><text x="440.0" y="195.0" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="middle">notificação (≤ 10 µs)</text><rect x="504" y="205" width="12" height="95" fill="#cfcfcf" stroke="#222" stroke-width="1"/><rect x="522" y="226" width="118" height="36" rx="2" fill="#fffbe6" stroke="#222" stroke-width="1.4"/><text x="581.0" y="237.4" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="middle">média + tabela + PI</text><text x="581.0" y="250.6" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="middle">≈ 160 µs</text><line x1="510" y1="300" x2="650" y2="300" stroke="#222" stroke-width="1.4" marker-end="url(#fim)"/><text x="580.0" y="290.0" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="middle">período e largura (≈ 0,17 ms)</text><line x1="650" y1="340" x2="80" y2="340" stroke="#222" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#fim)"/><text x="365.0" y="330.0" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="middle">largura do pulso lida no próximo lockstep</text><line x1="20" y1="372" x2="990" y2="372" stroke="#999" stroke-width="1"/><text x="24" y="386.0" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="middle">a cada 20 ms</text><rect x="784" y="395" width="12" height="85" fill="#cfcfcf" stroke="#222" stroke-width="1"/><rect x="660" y="400" width="120" height="36" rx="2" fill="#fffbe6" stroke="#222" stroke-width="1.4"/><text x="720.0" y="411.4" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="middle">copia o estado</text><text x="720.0" y="424.59999999999997" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(seção crítica)</text><line x1="790" y1="455" x2="930" y2="455" stroke="#222" stroke-width="1.4" marker-end="url(#fim)"/><text x="860.0" y="445.0" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="middle">0x100, 0x101 (≈ 0,25 ms cada)</text><line x1="930" y1="505" x2="790" y2="505" stroke="#222" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#fim)"/><text x="860.0" y="495.0" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="middle">comando 0x200 → ISR CAN → fila</text><line x1="20" y1="540" x2="990" y2="540" stroke="#999" stroke-width="1"/><text x="24" y="554.0" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="middle">t = 10 ms</text><line x1="230" y1="580" x2="370" y2="580" stroke="#222" stroke-width="1.4" marker-end="url(#fim)"/><text x="300.0" y="570.0" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="middle">próximo bloco</text><rect x="364" y="580" width="12" height="30" fill="#cfcfcf" stroke="#222" stroke-width="1"/><line x1="370" y1="610" x2="510" y2="610" stroke="#222" stroke-width="1.4" marker-end="url(#fim)"/><text x="440.0" y="600.0" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="middle">notificação</text></svg>