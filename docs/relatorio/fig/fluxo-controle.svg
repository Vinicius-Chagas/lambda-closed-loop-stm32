<svg xmlns="http://www.w3.org/2000/svg" width="500" height="870" viewBox="0 0 500 870"><rect width="100%" height="100%" fill="white"/><defs><marker id="fim" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker><marker id="ini" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#222"/></marker></defs><rect x="110.0" y="10" width="300" height="46" rx="6" fill="#e8e8e8" stroke="#222" stroke-width="1.4"/><text x="260.0" y="33.0" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">TIM15 dispara o ADC (1 kHz)</text><rect x="110.0" y="80" width="300" height="46" rx="6" fill="#e8e8e8" stroke="#222" stroke-width="1.4"/><text x="260.0" y="95.8" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">ADC converte λ, TPS e RPM;</text><text x="260.0" y="110.19999999999999" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">DMA grava no buffer circular</text><polygon points="260,165.0 390.0,200 260,235.0 130.0,200" fill="white" stroke="#222" stroke-width="1.4"/><text x="260" y="192.8" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">10 conjuntos</text><text x="260" y="207.20000000000002" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">completos?</text><rect x="110.0" y="270" width="300" height="46" rx="6" fill="#e8e8e8" stroke="#222" stroke-width="1.4"/><text x="260.0" y="285.8" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">ISR do DMA:</text><text x="260.0" y="300.2" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">vTaskNotifyGiveFromISR</text><rect x="110.0" y="340" width="300" height="46" rx="6" fill="white" stroke="#222" stroke-width="1.4"/><text x="260.0" y="355.8" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">ControlTask desbloqueia</text><text x="260.0" y="370.2" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(ulTaskNotifyTake)</text><rect x="110.0" y="410" width="300" height="46" rx="6" fill="white" stroke="#222" stroke-width="1.4"/><text x="260.0" y="425.8" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Média do bloco → λ, TPS, RPM</text><text x="260.0" y="440.2" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">t_base = tabela(TPS, RPM)</text><polygon points="260,495.0 360.0,530 260,565.0 160.0,530" fill="white" stroke="#222" stroke-width="1.4"/><text x="260" y="522.8" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Malha</text><text x="260" y="537.1999999999999" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">fechada?</text><rect x="40" y="590" width="150" height="46" rx="6" fill="white" stroke="#222" stroke-width="1.4"/><text x="115.0" y="613.0" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">c = PI(λ − λ_alvo)</text><rect x="330" y="590" width="150" height="46" rx="6" fill="white" stroke="#222" stroke-width="1.4"/><text x="405.0" y="613.0" font-family="Liberation 