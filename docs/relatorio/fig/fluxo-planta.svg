<svg xmlns="http://www.w3.org/2000/svg" width="420" height="680" viewBox="0 0 420 680"><rect width="100%" height="100%" fill="white"/><defs><marker id="fim" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker><marker id="ini" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#222"/></marker></defs><rect x="60.0" y="10" width="300" height="46" rx="6" fill="#e8e8e8" stroke="#222" stroke-width="1.4"/><text x="210.0" y="25.8" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Carrega ecu.elf no Renode</text><text x="210.0" y="40.2" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(monitor TCP)</text><rect x="60.0" y="80" width="300" height="46" rx="6" fill="white" stroke="#222" stroke-width="1.4"/><text x="210.0" y="95.8" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Aplica comandos do painel</text><text x="210.0" y="110.19999999999999" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(CAN 0x310: acelerador, perturbações)</text><rect x="60.0" y="150" width="300" height="46" rx="6" fill="white" stroke="#222" stroke-width="1.4"/><text x="210.0" y="165.8" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Motor: rotação, ar admitido,</text><text x="210.0" y="180.20000000000002" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">combustível e λ no cilindro</text><rect x="60.0" y="220" width="300" height="46" rx="6" fill="white" stroke="#222" stroke-width="1.4"/><text x="210.0" y="243.0" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Atraso do escape e sonda λ</text><rect x="60.0" y="290" width="300" height="46" rx="6" fill="white" stroke="#222" stroke-width="1.4"/><text x="210.0" y="305.8" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Sensores (goroutines) geram as</text><text x="210.0" y="320.2" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">tensões; barreira do passo</text><polygon points="210,375.0 330.0,410 210,445.0 90.0,410" fill="white" stroke="#222" stroke-width="1.4"/><text x="210" y="402.8" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">5 passos</text><text x="210" y="417.2" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">de 1 ms?</text><rect x="60.0" y="480" width="300" height="46" rx="6" fill="#e8e8e8" stroke="#222" stroke-width="1.4"/><text x="210.0" y="495.8" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">lockstep: tensões → ADC,</text><text x="210.0" y="510.2" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">ECU avança 5 ms</text><rect x="60.0" y="550" width="300" height="46" rx="6" fill="#e8e8e8" stroke="#222" stroke-width="1.4"/><text x="210.0" y="565.8" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Lê a largura do pulso no TIM2</text><text x="210.0" y="580.1999999999999" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">e aplica ao bico da planta</text><rect x="60.0" y="620" width="300" height="46" rx="6" fill="white" stroke="#222" stroke-width="1.4"/><text x="210.0" y="635.8" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Publica 0x300 (20 ms)</text><text x="210.0" y="650.1999999999999" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle">e grava a amostra no CSV</text><polyline points="210,56 210,80" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#fim)"/><polyline points="210,126 210,150" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#fim)"/><polyline points="210,196 210,220" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#fim)"/><polyline points="210,266 210,290" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#fim)"/><polyline points="210,336 210,375" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#fim)"/><polyline points="210,445 210,480" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#fim)"/><polyline points="210,526 210,550" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#fim)"/><text x="224" y="462.0" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="middle">sim</text><polyline points="330,410 395,410 395,173 360.0,173" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#fim)"/><text x="388" y="398.0" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" dominant-baseline="middle">não</text><polyline points="60.0,643 25,643 25,103 60.0,103" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#fim)"/><text transform="rotate(-90 12 380)" x="12" y="380.0" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="middle">próximo passo de sincronização</text></svg>